name: tthol_bot CI

on:
  push:
    branches:
      - master

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/hanshino/tthol_bot:latest
            ghcr.io/hanshino/tthol_bot:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/hanshino/tthol_bot:buildcache
          cache-to: type=registry,ref=ghcr.io/hanshino/tthol_bot:buildcache,mode=max
